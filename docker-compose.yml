services:

  db:
    image: postgres:16-alpine
    container_name: lomax-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - database_network

    restart: unless-stopped


  backend:
    image: lomax-backend:1.0

    build:
      context: ./backend

    container_name: lomax-backend

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: >
        Host=db;
        Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - web_network
      - database_network

    restart: unless-stopped


  frontend:
    image: lomax-frontend:1.0

    build:
      context: ./frontend

    container_name: lomax-frontend

    networks:
      - web_network

    restart: unless-stopped


  reverse-proxy:
    image: lomax-proxy:1.0

    build:
      context: ./reverse-proxy

    container_name: lomax-proxy

    ports:
      - "8080:80"

    depends_on:
      - backend
      - frontend

    networks:
      - web_network

    restart: unless-stopped


networks:

  web_network:
    driver: bridge

  database_network:
    driver: bridge


volumes:

  postgres_data: